[project]
name = "agent-runtime"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rajatrc1705", email = "rajatrc1705@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
agent-runtime = "agent_runtime:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
